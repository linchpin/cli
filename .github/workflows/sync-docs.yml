name: Sync docs to WordPress

# Publishes docs/ to the Linchpin documentation site via DocsPress, at
# https://docs.linchpin.com/cli/
#
# SAFETY POSTURE — this workflow is intentionally inert on first commit:
#   * manual trigger only (no push trigger)
#   * dry-run: true      — plans every operation, writes nothing
#   * status: draft      — created pages are drafts, not public
#   * delete-mode: trash — removals go to Trash, never hard-deleted
#
# Promote it in this order, confirming the Actions summary at each step:
#   1. Run manually as-is. Review the planned create/update/delete counts.
#   2. Set dry-run: false. Pages are created as drafts. Review the page tree.
#   3. Set status: publish once the content and hierarchy look right.
#   4. Only then add the push trigger commented out at the bottom.
#
# ⚠️ WHY THIS PUBLISHES AT /cli/ RATHER THAN UNDER AN EXISTING SECTION.
#
# DocsPress identifies its own pages by an HTML sentinel comment in the page
# content, and it ALWAYS generates the root page — ensurePlaceholderHierarchy
# has no opt-out. A page it did not create carries no sentinel, so syncPages
# refuses it rather than overwriting:
#
#     "An unmanaged WordPress page already uses this path."
#
# That refusal is the safe behaviour, but it cascades: the skipped root never
# enters the parent lookup, so every descendant then fails with
# "Parent page is unavailable". A dry run against the hand-authored
# /engineering-resources/ page produced exactly that — 7 pages, 7 conflicts,
# nothing written.
#
# There is no mode that attaches to an unmanaged parent. So a shared section
# either becomes DocsPress-managed, or you own a root of your own. This repo
# owns /cli/, which leaves /engineering-resources/ untouched.
#
# If this is ever moved under a shared parent, that parent must be
# DocsPress-managed first, and managed-path must then be set to this
# repository's own branch of the tree so a sync here cannot trash another
# repository's pages.
#
# Both actions are pinned to immutable commit SHAs. Do not replace them with
# floating tags — this job is exposed to a WordPress token.
#
# ⚠️ This repository is PUBLIC and this job holds a WordPress write token.
# Never add pull_request or pull_request_target triggers: a fork could then
# reach the token. workflow_dispatch and push-to-main both require write access.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan only, write nothing"
        type: boolean
        default: true
      status:
        description: "Status for created or updated pages"
        type: choice
        options:
          - draft
          - publish
        default: draft

permissions:
  contents: read

concurrency:
  group: docspress-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # linchpin/docspress feature/managed-path-scope. This SHA is NOT on main:
      # managed-path exists only on that branch. Moving to a main-tracking ref
      # would silently drop the input, and with it the deletion scoping that
      # keeps this repository from trashing another repository's pages under the
      # shared engineering-resources parent.
      - uses: linchpin/docspress@381b29cf2dd48c365629615b35b572c877fdd865
        with:
          mode: publish

          # Self-hosted target. Do not append /wp-json — DocsPress does that.
          # docs.linchpin.com is a subsite of the Linchpin multisite.
          wordpress-url: https://docs.linchpin.com
          wordpress-site: docs.linchpin.com
          wordpress-access-token: ${{ secrets.WP_ACCESS_TOKEN }}

          docs-dir: docs

          # This repository owns the whole /cli/ tree, so the root it generates
          # is its own rather than one shared with other repositories. That is
          # what removes the adoption problem described above.
          #
          # docs/README.md becomes this root page itself — DocsPress treats
          # README and index as the section page — and its siblings become
          # children at /cli/<name>/.
          root-slug: cli
          root-title: Linchpin CLI

          # Equal to root-slug, which is also the default. Stated explicitly so
          # that anyone moving this under a shared parent has to change it here
          # deliberately rather than inherit a default that would scope deletion
          # to the entire shared subtree.
          managed-path: cli

          # The DocsPress theme renders the page title itself, so do not let the
          # action inject a duplicate H1 block.
          create-h1: false

          # Rewrite relative Markdown links to the generated page URLs.
          rewrite-links: true

          # "Edit this page on GitHub". github-repository defaults to
          # GITHUB_REPOSITORY, so this keeps working through the repository
          # rename without an edit here.
          edit-link: true

          status: ${{ inputs.status || 'draft' }}
          delete-mode: trash
          dry-run: ${{ inputs.dry-run == false && 'false' || 'true' }}

