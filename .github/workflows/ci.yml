name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the current release. A break on either is a break.
        node: ['22.12', '24']
    env:
      # The publish job sets this for the same reason: hooks are for humans committing,
      # not for a checkout that only installs and verifies.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  agent-lint:
    name: Agent-readiness
    runs-on: ubuntu-latest
    needs: test
    env:
      HUSKY: 0
      # Pinned deliberately rather than @latest, so a linter release cannot turn a
      # green PR red on its own. Bump it as its own change and re-record the baseline.
      CLI_AGENT_LINT_VERSION: '0.3.5'
      # A floor, not a target — raise it whenever the score improves, so a gain
      # cannot be given back silently.
      #
      # ⚠️ Record the number THIS JOB reports, never a local run. SD-5 (skill /
      # context files) passes locally off an untracked, gitignored .claude/
      # directory that does not exist in a clean checkout, so a workstation
      # reads ~1.7 points high. CI is the gate, so CI is the measurement.
      #
      #   77% — 2026-08-06, pre-rewrite surface (LINCHPIN-5365, local — inflated)
      #   80% — 2026-08-06, command registry (LINCHPIN-5367, local — inflated)
      #   84% — 2026-08-06, dual-mode contract (LINCHPIN-5368): --json, --quiet,
      #         --no-color, documented exit codes. First CI-measured figure.
      #
      # Outstanding: completions and schema (SD-3/SD-4, LINCHPIN-5375), env-var
      # auth (FS-4, arrives with `task` in LINCHPIN-5379), skill/context files
      # (SD-5, arrives with the bundled skills in LINCHPIN-5381), timeout
      # (PV-1, unowned).
      #
      # SD-1 stays a warning deliberately — it wants JSON on stderr by default,
      # but this CLI is human-readable by default and structured on request,
      # matching gh and wrangler. Degrading human output to score a point is not
      # a trade we are making.
      CLI_AGENT_LINT_MIN_SCORE: '84'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install cli-agent-lint
        run: |
          set -euo pipefail
          url="https://github.com/Camil-H/cli-agent-lint/releases/download/v${CLI_AGENT_LINT_VERSION}/cli-agent-lint_${CLI_AGENT_LINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/cli-agent-lint.tar.gz "$url"
          tar -xzf /tmp/cli-agent-lint.tar.gz -C /tmp
          chmod +x /tmp/cli-agent-lint
          /tmp/cli-agent-lint --version

      - name: Check agent-readiness
        run: |
          set -euo pipefail
          /tmp/cli-agent-lint check ./dist/cli.js -o json > /tmp/report.json 2>/dev/null || true
          # The same scorer `scripts/preflight.sh` runs, so a local preflight
          # cannot disagree with this gate.
          node scripts/agent-lint-report.mjs /tmp/report.json
