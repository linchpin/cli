name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to the engines.node floor (>=22.12.0), NOT the latest Node.
          # This job builds, tests and publishes, so running it on the floor is
          # what proves the artifact works on the oldest runtime we claim to
          # support. Renovate is configured not to bump this line — see
          # renovate.json. Newer versions are covered by the CI matrix.
          node-version: '22.12'
          registry-url: https://registry.npmjs.org

      # Required before anything runs. `npm test` triggers `pretest -> build`,
      # and the build needs devDependencies. Without this the job fails with
      # "tsdown: not found" — which is exactly how v1.1.0 came to be tagged and
      # released on GitHub while nothing was ever published to npm.
      - name: Install
        run: npm ci
        env:
          HUSKY: 0

      - name: Run tests
        run: npm test
        env:
          HUSKY: 0

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
