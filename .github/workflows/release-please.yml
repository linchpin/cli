name: Release

on:
  push:
    branches:
      - main
  # `tag` republishes a version that is already tagged. The publish job fires
  # on the single push where release-please reports `release_created`, so a
  # publish that fails for a reason outside the code strands that version:
  # the tag and the GitHub release exist, and re-running only re-runs
  # release-please, which now finds nothing to do. The old error message on
  # this job told the operator to "re-run this job on the existing tag" - this
  # is the input that finally makes that possible.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.3. Leave empty to only refresh the release PR.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    # A manual publish republishes something release-please already cut, so
    # there is nothing for it to do and its output goes unused.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-please
    # `always()` because the dispatch path skips release-please entirely, and
    # a skipped dependency would otherwise skip this job too.
    if: >-
      ${{
        always() && (
          ( github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' )
          || ( github.event_name == 'workflow_dispatch' && inputs.tag != '' )
        )
      }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted Publishing. npm mints a short-lived credential from this
      # token, which is also what signs the provenance attestation.
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to the engines.node floor (>=22.12.0), NOT the latest Node.
          # This job builds, tests and publishes, so running it on the floor is
          # what proves the artifact works on the oldest runtime we claim to
          # support. Renovate is configured not to bump this line — see
          # renovate.json. Newer versions are covered by the CI matrix.
          node-version: '22.12'
          registry-url: https://registry.npmjs.org

      # Required before anything runs. `npm test` triggers `pretest -> build`,
      # and the build needs devDependencies. Without this the job fails with
      # "tsdown: not found" — which is exactly how v1.1.0 came to be tagged and
      # released on GitHub while nothing was ever published to npm.
      - name: Install
        run: npm ci
        env:
          HUSKY: 0

      - name: Run tests
        run: npm test
        env:
          HUSKY: 0

      # Deliberately after the install and the tests, not before them, so both
      # still run on the npm that ships with the floor Node — which is what a
      # consumer on the oldest supported runtime actually has. Only the
      # publish needs a newer client.
      #
      # `npm@^11.5.1`, never `npm@latest`. Trusted publishing needs >= 11.5.1,
      # Node 22.12 ships 10.9.0, and npm 12 requires Node ^22.22.2 — so
      # `latest` would install a client that refuses to run on the very
      # runtime this job pins on purpose. The 11.x line is the overlap.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'

          version="$( npm --version )"
          required="11.5.1"
          echo "npm ${version} on node $( node --version )"

          if [ "$( printf '%s\n%s\n' "$version" "$required" | sort -V | head -n1 )" != "$required" ]; then
            echo "::error::npm ${version} cannot use trusted publishing. Needs >= ${required}."
            exit 1
          fi

      # No NODE_AUTH_TOKEN. npm authenticates over OIDC against the trusted
      # publisher registered for this package, and attaches provenance itself.
      - name: Publish to npm
        env:
          HUSKY: 0
        run: |
          if npm publish --access public; then
            exit 0
          fi

          # With no token in play, a failure here is almost always the trusted
          # publisher record not matching what actually ran. npm does not
          # validate that record when it is saved, so a wrong repository or
          # workflow filename only ever surfaces as a failed publish. Check it
          # with `npm trust list @linchpinagency/cli`: repository must be
          # linchpin/cli, file must be release-please.yml, and environment must
          # be empty, because this job declares none.
          echo "::error::npm publish failed with no token in play, so OIDC did not satisfy the registry. Run 'npm trust list @linchpinagency/cli' and confirm repository=linchpin/cli, file=release-please.yml and an empty environment. Once fixed, re-run this workflow with tag=${RELEASE_TAG} rather than cutting a new release."
          exit 1
